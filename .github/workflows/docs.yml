name: Publish FRSE website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install website generator
        run: python -m pip install zensical
      - name: Validate metadata and generate catalogs
        run: python scripts/generate_catalog.py --check
      - name: Generate public catalogs
        run: python scripts/generate_catalog.py
      - name: Build website
        run: zensical build --clean
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
